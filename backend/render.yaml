services:
  - type: web
    name: gamerzone-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/productos
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: mariadb
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: FRONTEND_URL
        sync: false
