spring.application.name=backend

# --- Swagger UI (documentacion de la API.) ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Base de datos H2 (en memoria) ---
spring.datasource.url=jdbc:h2:mem:marketplacedb
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- JWT (CU-27): definir JWT_SECRET en produccion; minimo 32 caracteres ---
jwt.secret=${JWT_SECRET:desarrollo-cambiar-en-produccion-0123456789abcdef}
jwt.horas-expiracion=2
