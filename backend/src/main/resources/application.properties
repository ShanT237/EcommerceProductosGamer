spring.application.name=backend

# --- Swagger UI (documentacion de la API.) ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Base de datos por defecto: H2 local para desarrollo/pruebas ---
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.url=${DB_URL:jdbc:h2:mem:marketplacedb;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# --- Consola web de H2 ---
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- Imagenes de producto (limite alineado con CloudinaryAlmacenImagenesProductos) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- JWT (CU-27): definir JWT_SECRET en produccion; minimo 32 caracteres ---
jwt.secret=${JWT_SECRET:desarrollo-cambiar-en-produccion-0123456789abcdef}
jwt.horas-expiracion=2

# --- Spring lea variables de entorno desde un archivo .env ---
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# --- Correos de notificaciones (descuento, stock, preventa, reembolso, reseñas). false = solo notificaciones internas ---
app.notificaciones.correo-habilitado=${NOTIFICACIONES_CORREO_HABILITADO:true}

server.port=${PORT:8080}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000,http://127.0.0.1:3000}

# --- Asistente IA (OpenRouter). Sin OPENROUTER_API_KEY el endpoint responde 503 ---
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.model=${OPENROUTER_MODEL:openrouter/auto}
openrouter.max-tokens=700

# --- Chat en vivo (SSE): timeout del emisor y latido, en milisegundos ---
chat.sse.timeout-ms=${CHAT_SSE_TIMEOUT_MS:300000}
chat.sse.heartbeat-ms=${CHAT_SSE_HEARTBEAT_MS:25000}